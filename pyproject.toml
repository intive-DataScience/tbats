[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tbats"
dynamic = ["version"]
description = "BATS and TBATS for time series forecasting"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Grzegorz Skorupa (intive)", email = "grzegorz.skorupa@intive.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14.1",
    "scikit-learn>=1.6",
    "pmdarima>=2.1.1",
]

[project.urls]
Homepage = "https://github.com/intive-DataScience/tbats"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pip-tools>=7.4",
    "build>=1.2",
    "twine>=6.1",
]
r = ["rpy2"]

[tool.setuptools]
packages = { find = { include = ["tbats*"] } }

[tool.setuptools.dynamic]
version = { attr = "tbats.__version__" }

[tool.pytest.ini_options]
testpaths = ["test"]
