name: Python

on:
  push:
  pull_request:

jobs:
  test-matrix:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest test/
      - run: python scripts/spawn_smoke.py
        timeout-minutes: 10

  python-313-snapshot:
    name: macOS CPython 3.13 fixed snapshot
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade -r requirements-bootstrap.txt
      - run: python -m pip install --no-deps -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m pytest test/
      - run: python scripts/spawn_smoke.py
        timeout-minutes: 10

  minimum-dependencies:
    name: Python 3.13 minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy==2.1.0 scipy==1.14.1 scikit-learn==1.6.0 pmdarima==2.1.1 'pytest>=8.3'
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m pytest test/
      - run: python scripts/spawn_smoke.py
        timeout-minutes: 10

  build-clean-wheel:
    name: Python 3.13 build and clean wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv ../tbats-wheel-venv
      - working-directory: ..
        run: ./tbats-wheel-venv/bin/python -m pip install ./tbats/dist/*.whl
      - working-directory: ..
        run: ./tbats-wheel-venv/bin/python -m pip check
      - working-directory: ..
        run: ./tbats-wheel-venv/bin/python tbats/scripts/spawn_smoke.py
        timeout-minutes: 10
